name: 毎朝7時 スケアードストレート案件アラート

on:
  schedule:
    # 毎朝7:00 JST = 前日22:00 UTC
    - cron: '0 22 * * *'
  workflow_dispatch:  # 手動実行も可能

permissions:
  contents: write

jobs:
  collect-leads:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存パッケージをインストール
        run: pip install requests beautifulsoup4 lxml

      - name: 案件情報を収集して leads.json を更新
        run: python scared-straight/fetch_leads.py

      - name: leads.json をコミット＆プッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scared-straight/leads.json
          if git diff --cached --quiet; then
            echo "新着案件なし、スキップします"
          else
            git commit -m "leads: $(date +'%Y-%m-%d') スケアードストレート案件を自動更新"
            git push
          fi
